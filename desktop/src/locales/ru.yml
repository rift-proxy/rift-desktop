# Тексты интерфейса Rift, русский язык.
#
# Группы нужны переводчику; код обращается к тексту по полному пути, например `format.latency`.
# `{name}` в тексте заменяется значением при показе. Текст с формами числа задаётся словарём
# `one` / `few` / `many` / `other` (категории CLDR), выбирается по значению `count`.
# Строка со скобками `{}` в начале берётся в кавычки, иначе YAML прочтёт её как словарь.
#
# Язык называется самим файлом: имя файла (`ru`, `en`, `zh-CN`) — код языка в настройках. Список
# языков в «Настройках» и допустимые значения `Settings.language` берутся из всех файлов этого
# каталога, поэтому новый язык — новый файл с блоком `language` и теми же ключами.
#
# Тексты ядра (`core`, `shell`) и установщика (`installer`) лежат здесь же; в страницу попадают только
# тексты интерфейса, остальное из них генерируется (`tooling/locales-sync.mjs`).

language:
  # Название языка на нём самом, чтобы его находил тот, кто не читает текущий.
  name: "Русский"
  flag: "🇷🇺"
  # Тег BCP 47 для `Intl` и форматов даты и числа.
  tag: "ru-RU"

format:
  not_checked: "Ещё не проверено"
  never_checked: "Ещё не проверялся"
  checked_at: "Проверено {at}"
  retry_at: "Спросим снова в {time}"
  latency: "{value} мс"
  countdown: "{value} сек"
  speed: "{value}/с"
  size: "{value} {unit}"
  usage_of: "{used} из {total}"
  usage_used: "Использовано {used}"
  duration:
    seconds: "{s} с"
    minutes: "{m} мин"
    minutes_seconds: "{m} мин {s} с"
    hours: "{h} ч"
    hours_minutes: "{h} ч {m} мин"

bytes:
  b: "Б"
  kb: "КБ"
  mb: "МБ"
  gb: "ГБ"
  tb: "ТБ"
  pb: "ПБ"

mode:
  proxy: "Proxy"
  tun: "TUN"
  tun_proxy: "TUN + Proxy"

connection:
  connected: "Подключено"
  connecting: "Подключение…"
  disconnected: "Отключено"
  lost: "Соединение потеряно"
  error: "Ошибка подключения"
  unknown: "Неизвестное состояние"

