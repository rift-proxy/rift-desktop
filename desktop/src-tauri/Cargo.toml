[package]
name = "rift-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
url = "2.5.8"

[dependencies]
rift-core = { path = "../../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# No `zip` feature: the update is the NSIS installer itself (`createUpdaterArtifacts: true`), never an
# archive, and with the feature the plugin would unpack a zip with a `zip` crate that has open
# advisories (RUSTSEC-2026-0367, -0368, -0369).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tokio = { version = "1", features = ["full"] }
url = "2.5.8"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.3"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
