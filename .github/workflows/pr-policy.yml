name: PR policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  policy:
    name: PR policy
    # Advisory automation: do not configure this job as a required merge check.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # Maintain the advisory PR policy comment on fork PRs.
      issues: write # Apply/remove the policy labels through the issues API.
    steps:
      # Only trusted default-branch code runs with this token, never PR code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tooling/pr-policy.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { runPolicy } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/tooling/pr-policy.mjs`).href);
            const result = await runPolicy({ github, context });
            if (result.sizeExceeded) core.warning(result.recommendation);
            if (result.inspectionError) core.setFailed(result.inspectionError);
