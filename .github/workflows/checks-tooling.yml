name: Public tooling and localization
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      full:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tooling:
    name: Public helpers, 32 localization and 43 workflow validation
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm --dir desktop install --frozen-lockfile
      - name: Test public CI isolation and residual policy
        run: python3 -m unittest discover -s tooling/ci -p 'test_*.py'
      - name: Install checksum-pinned public CI validators
        run: python3 tooling/ci/install.py
      - name: 43 — Validate tracked public workflows without executing jobs (release check 50)
        run: python3 tooling/ci/validate.py
      - name: Install public helper fixture dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full nsis
      - name: Test standalone public helpers
        run: node --test "tooling/*.test.mjs" "tooling/perf/*.test.mjs"
      - name: 32 hardcoded frontend, Rust and installer text and generated locales
        run: |
          set -euo pipefail
          node tooling/hardcoded-text-check.mjs
          node tooling/locales-sync.mjs check
      - name: Check manifest and lockfile versions
        run: |
          set -euo pipefail
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("desktop/src-tauri/tauri.conf.json", "utf8")).version')"
          node tooling/release-check.mjs versions "v$version"
