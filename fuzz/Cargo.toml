test = false
doc = false
bench = false

[[bin]]
name = "clash_api"
path = "fuzz_targets/clash_api.rs"
test = false
doc = false
bench = false

[[bin]]
name = "helper_frame"
path = "fuzz_targets/helper_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_query"
path = "fuzz_targets/dns_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sidecar_log"
path = "fuzz_targets/sidecar_log.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_details"
