[package]
name = "rift-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
futures = "0.3"
libfuzzer-sys = "0.4"
rift-core = { path = "../core" }
serde_json = "1"

[[bin]]
name = "subscription"
path = "fuzz_targets/subscription.rs"
