[workspace]
members = ["core", "desktop/src-tauri"]
default-members = ["core"]
resolver = "2"

[workspace.package]
license = "MIT"
version = "1.1.1"
edition = "2021"
publish = false

# The debug info of a release goes to the PDB beside the executable (MSVC), not into it. It holds
# the lines of source for addresses and is kept with the release, never sent anywhere: an address
# of an error report is read against it later.
[profile.release]
debug = "line-tables-only"
# Reduce duplicate code after the two-core migration while retaining external PDB symbols.
lto = "thin"
codegen-units = 1

# Optimised like release, with debug info for Samply/Heaptrack stacks.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"
