[workspace]
members = ["core", "desktop/src-tauri"]
default-members = ["core"]
resolver = "2"

[workspace.package]
license = "MIT"
version = "1.1.2"
edition = "2021"
publish = false

[profile.release]
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1

# Gungraun needs named benchmark functions for collection; benchmarks are not shipped.
[profile.bench]
debug = "line-tables-only"
strip = "none"

# Optimised like release, with debug info for Samply/Heaptrack stacks.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"
